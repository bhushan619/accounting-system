services:
  backend:
    build: ./backend
    image: accounting-system-backend:latest
    environment:
      - MONGODB_URI=mongodb://your-mongo-host:27017/velosync
      - JWT_SECRET=${JWT_SECRET:-hrVwJGQgD4d2T5WeMhjatlEFisfyJgWow3m+jlwlLLEpAT6kt+h3Da4IlIsCVsjL1PuWGFnoFxi0bEQxwKGZjQ==}
      - JWT_EXP=7d
      - REFRESH_EXP=7d
      - UPLOADS_DIR=./uploads
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://localhost:8005,http://localhost
      - FRONTEND_URL=http://localhost:8005
    ports:
      - "4005:4005"

  frontend:
    build: .
    image: accounting-system-frontend:latest
    ports:
      - "8005:80"
    depends_on:
      - backend
